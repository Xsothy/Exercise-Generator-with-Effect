<!doctype html>
<!-- PROTOTYPE, throwaway. Question: which top-level strands should the topic tree have?
     Four groupings of the real 623-topic inventory, switchable via ?variant=A..D (or ← →).
     Open this file directly in a browser; data.js is generated by extract.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strand grouping prototype</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px 16px 90px; background: #f7f7f5; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .why { color: #555; margin: 0 0 16px; max-width: 70ch; }
  .bar { display: flex; height: 34px; border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
  .bar div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; white-space: nowrap; overflow: hidden; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .strand { background: #fff; border-radius: 8px; padding: 12px; border-top: 5px solid; }
  .strand h2 { font-size: 15px; margin: 0; }
  .meta { color: #666; font-size: 12px; margin: 2px 0 8px; }
  details { border-top: 1px solid #eee; padding: 4px 0; }
  summary { cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  summary span:last-child { color: #888; font-size: 12px; white-space: nowrap; }
  ul { margin: 4px 0 4px 0; padding-left: 18px; font-size: 13px; }
  li small { color: #888; }
  .b { color: #1a7f37; } .n { color: #9a6700; } .o { color: #cf222e; }
  .ex { background: #ddf4ff; border-radius: 3px; padding: 0 3px; font-size: 11px; }
  #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #111; color: #fff;
    border-radius: 999px; padding: 6px 10px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 16px #0005; }
  #switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font-size: 16px; }
  #label { min-width: 240px; text-align: center; font-size: 13px; }
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="why" id="why"></p>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
<div id="switcher"><button id="prev">←</button><span id="label"></span><button id="next">→</button></div>
<script src="data.js"></script>
<script>
const COLORS = ['#3b6fb6', '#8a4fb5', '#c2732b', '#2f8f6b', '#b8434f', '#5a6b7b', '#9b8a2a']
const num = s => s.split(' ')[0]
const all = [...new Set(ROWS.map(r => r.section))]
const pick = (...ids) => all.filter(s => ids.includes(num(s)))
const range = (a, b) => all.filter(s => { const [x, y] = num(s).split('.').map(Number); return x === a && (y === undefined || y >= b[0] && y <= b[1]) })

const VARIANTS = {
  A: { name: '6 strands, as the inventory', why: 'The inventory\'s own six areas. Mechanics stands alone (14 topics, all G11–12).', strands: [
    ['Number', range(3, [1, 14])], ['Algebra and functions', range(4, [1, 8])], ['Geometry and measures', range(5, [1, 10])],
    ['Statistics and probability', range(6, [1, 7])], ['Calculus', range(7, [1, 5])], ['Mechanics', pick('8')]] },
  B: { name: '5 strands, mechanics in calculus', why: 'The five strands the curricula share. Mechanics joins Calculus, next to Kinematics with calculus.', strands: [
    ['Number', range(3, [1, 14])], ['Algebra and functions', range(4, [1, 8])], ['Geometry and measures', range(5, [1, 10])],
    ['Statistics and probability', range(6, [1, 7])], ['Calculus and mechanics', [...range(7, [1, 5]), ...pick('8')]]] },
  C: { name: 'Functions split out of Algebra', why: 'Algebra keeps expressions, equations and sequences. Graphs and functions become their own strand (as CCSS high school does).', strands: [
    ['Number', range(3, [1, 14])], ['Algebra', pick('4.1', '4.2', '4.3', '4.6', '4.8')], ['Functions and graphs', pick('4.4', '4.5', '4.7')],
    ['Geometry and measures', range(5, [1, 10])], ['Statistics and probability', range(6, [1, 7])], ['Calculus and mechanics', [...range(7, [1, 5]), ...pick('8')]]] },
  D: { name: 'Measurement split, further maths apart', why: 'Measurement is its own strand (as in CCSS Measurement & Data and England). The G11–12 pieces of Number (complex numbers, matrices) and Proof move into a "Further maths" strand.', strands: [
    ['Number', range(3, [1, 12])], ['Algebra and functions', range(4, [1, 7])], ['Geometry', pick('5.1', '5.2', '5.3', '5.4', '5.5', '5.6', '5.9', '5.10')],
    ['Measurement', pick('5.7', '5.8')], ['Statistics and probability', range(6, [1, 7])], ['Calculus and mechanics', [...range(7, [1, 5]), ...pick('8')]],
    ['Further maths', pick('3.13', '3.14', '4.8')]] },
}
const keys = Object.keys(VARIANTS)

function grades(rows) {
  const ns = rows.flatMap(r => (r.grades.match(/G(\d+)/g) || []).map(g => +g.slice(1)))
  return ns.length ? `G${Math.min(...ns)}–G${Math.max(...ns)}` : '?'
}
function counts(rows) {
  const c = k => rows.filter(r => r.check === k).length
  return `<span class="b">${c('buildable-now')} buildable</span> · <span class="n">${c('new-answer-type')} new type</span> · <span class="o">${c('owner-todo')} to-do</span>`
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])

function render(k) {
  const v = VARIANTS[k]
  const used = new Set(v.strands.flatMap(s => s[1]))
  const missing = all.filter(s => !used.has(s))
  if (missing.length) console.warn('unplaced', missing)
  document.getElementById('title').textContent = `Variant ${k}: ${v.name}`
  document.getElementById('why').textContent = v.why
  document.getElementById('label').textContent = `${k} (${v.name})`
  const total = ROWS.length
  document.getElementById('bar').innerHTML = v.strands.map(([name, secs], i) => {
    const n = ROWS.filter(r => secs.includes(r.section)).length
    return `<div style="flex:${n};background:${COLORS[i]}" title="${name}: ${n}">${name} ${n}</div>`
  }).join('')
  document.getElementById('grid').innerHTML = v.strands.map(([name, secs], i) => {
    const rows = ROWS.filter(r => secs.includes(r.section))
    return `<section class="strand" style="border-color:${COLORS[i]}">
      <h2>${name}</h2>
      <div class="meta">${rows.length} topics · ${secs.length} sub-strands · ${grades(rows)}<br>${counts(rows)}</div>
      ${secs.map(s => { const rs = rows.filter(r => r.section === s); return `<details><summary><span>${esc(s.replace(/^[\d.]+ /, ''))}</span><span>${rs.length} · ${grades(rs)}</span></summary><ul>${
        rs.map(r => `<li class="${r.check[0]}">${esc(r.topic)} <small>${r.grades}</small>${r.existing ? ` <span class="ex">${esc(r.existing)}</span>` : ''}</li>`).join('')}</ul></details>` }).join('')}
    </section>`
  }).join('')
}

let cur = new URLSearchParams(location.search).get('variant') || 'A'
if (!keys.includes(cur)) cur = 'A'
function go(d) {
  cur = keys[(keys.indexOf(cur) + d + keys.length) % keys.length]
  const u = new URL(location.href); u.searchParams.set('variant', cur); history.replaceState(null, '', u)
  render(cur)
}
document.getElementById('prev').onclick = () => go(-1)
document.getElementById('next').onclick = () => go(1)
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1)
})
render(cur)
</script>
</body>
</html>
